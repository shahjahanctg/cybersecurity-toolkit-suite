[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-toolkit"
version = "0.1.0"
description = "Desktop GUI + CLI cybersecurity toolkit suite (network recon, defense, proxying, vuln scanning, forensics, malware analysis, red team). Lab/authorized-use only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cybersecurity Toolkit Suite" }]
keywords = ["security", "redteam", "blueteam", "forensics", "malware", "network"]
classifiers = [
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "scapy>=2.5",
    "dnspython>=2.4",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=7", "pip-audit>=2.6"]

[project.scripts]
sec-toolkit = "sectoolkit.cli.main:main"
sec-toolkit-gui = "sectoolkit.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sectoolkit = ["py.typed", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "priv: tests that require elevated privileges (root / CAP_NET_RAW)",
    "lab: tests that must run only against loopback",
]

[tool.ruff]
line-length = 100
target-version = "py311"